# Tool configuration only. Dependencies live in requirements.txt.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
# E/W: style, F: real mistakes (unused imports, undefined names),
# I: import order, B: common bugs, UP: outdated syntax.
select = ["E", "W", "F", "I", "B", "UP"]
# B008 complains about `Depends(...)` in function defaults, which is the
# normal FastAPI way of declaring dependencies.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# The seed data is written as wide table rows; wrapping them hurts readability.
"scripts/seed.py" = ["E501"]
# The assistant's instructions are prose, one paragraph per line, and the
# place list is wide table rows, like the seed data.
"app/services/assist/prompt.py" = ["E501"]
"alembic/versions/0006_places_and_assistant.py" = ["E501"]
# The frozen category tree with its search words, one category per line.
"alembic/versions/0017_category_tree_v2.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

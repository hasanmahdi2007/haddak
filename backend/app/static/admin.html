<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Haddak admin</title>
<!--
  One self-contained page: no build step, no external files.
  It only calls the admin endpoints: GET and PATCH /api/v1/admin/providers,
  GET, DELETE and POST .../publish on /api/v1/admin/suggestions,
  GET and DELETE /api/v1/admin/reports,
  plus the public GET /api/v1/categories (for the category list when publishing).
  The admin key lives in a JavaScript variable: it is gone when the tab is
  closed or reloaded, and is never written to storage or cookies.
-->
<style>
  :root {
    --page: #f4f2ee; --card: #ffffff; --ink: #1d1b18; --muted: #6a655d; --line: #dcd7ce;
    --accent: #0f6b5c; --accent-ink: #ffffff; --danger: #a3301f; --warn-bg: #fdf1d6; --warn-ink: #6b4a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #161513; --card: #211f1c; --ink: #efebe4; --muted: #a8a196; --line: #3a3732;
      --accent: #4fb8a4; --accent-ink: #10201d; --danger: #ef8a78; --warn-bg: #3b3013; --warn-ink: #f1d48a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 18px; margin: 0; overflow-wrap: anywhere; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button {
    min-height: 44px; padding: 8px 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card);
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  input[type="password"], input[type="date"], input[type="text"], input[type="number"], select, textarea {
    min-height: 44px; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card);
  }
  .publish-form { display: grid; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .publish-form[hidden] { display: none; }  /* display: grid would otherwise un-hide it */
  .publish-form label { display: grid; gap: 4px; color: var(--muted); font-size: 14px; }
  .publish-form input, .publish-form select, .publish-form textarea { width: 100%; color: var(--ink); font-size: 16px; }
  .publish-form textarea { min-height: 88px; resize: vertical; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .panel, .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .key-form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .key-form input { flex: 1 1 200px; min-width: 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .tabs button { flex: 1 1 auto; padding: 8px 12px; }
  .tabs button[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); font-weight: 600; }
  #message { min-height: 24px; margin: 8px 0; }
  #message.error { color: var(--danger); font-weight: 600; }
  .card { margin-bottom: 12px; }
  .card-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-ink); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 12px 0; }
  dt { color: var(--muted); font-size: 14px; }
  dd { margin: 0; overflow-wrap: anywhere; }
  .description { margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .links { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 8px 0 12px; }
  a { color: var(--accent); }
  .links a { padding: 8px 0; }
  .actions, .settings { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .settings { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .settings label { display: flex; align-items: center; gap: 8px; min-height: 44px; }
  .settings input[type="checkbox"] { width: 22px; height: 22px; }
  .spacer { flex: 1 1 100%; height: 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Haddak admin</h1>
    <button id="lock-button" type="button" hidden>Lock</button>
  </header>

  <section id="key-panel" class="panel">
    <label for="key-input"><strong>Admin key</strong></label>
    <form id="key-form" class="key-form">
      <input id="key-input" type="password" autocomplete="off" required>
      <button class="primary" type="submit">Unlock</button>
    </form>
    <p class="muted">Kept only in this tab's memory. Reloading the page asks for it again.</p>
  </section>

  <p id="message" role="status" aria-live="polite"></p>

  <section id="list-panel" hidden>
    <div class="tabs" id="tabs">
      <button type="button" data-status="pending">Pending</button>
      <button type="button" data-status="unverified">Unverified</button>
      <button type="button" data-status="verified">Verified</button>
      <button type="button" data-status="rejected">Rejected</button>
      <button type="button" data-status="suggestions">Suggestions</button>
      <button type="button" data-status="reports">Reports</button>
    </div>
    <div id="list"></div>
  </section>
</main>

<script>
"use strict";

// The admin key. Memory only: never saved to browser storage or cookies.
let adminKey = "";
// Which tab is open: a profile status, "suggestions" or "reports".
let currentStatus = "pending";
// The category list for the Publish form. Loaded once, the first time the
// Suggestions tab is opened.
let categories = null;

// How each report reason is shown.
const REASON_LABELS = {
  wrong_info: "Wrong information",
  not_real: "Not a real provider",
  closed: "Closed",
  offensive: "Offensive",
  other: "Other"
};

const keyPanel = document.getElementById("key-panel");
const keyForm = document.getElementById("key-form");
const keyInput = document.getElementById("key-input");
const lockButton = document.getElementById("lock-button");
const listPanel = document.getElementById("list-panel");
const list = document.getElementById("list");
const message = document.getElementById("message");
const tabButtons = Array.from(document.querySelectorAll("#tabs button"));

// ---------- small helpers ----------

// Creates an element. Text always goes in through textContent, so provider
// data (which is untrusted) can never be interpreted as HTML.
function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = String(text);
  if (className) node.className = className;
  return node;
}

// Provider URLs are untrusted too: a "javascript:..." link would run code
// when clicked. Only real web links are allowed.
function safeWebUrl(value) {
  try {
    const url = new URL(String(value));
    return url.protocol === "https:" || url.protocol === "http:" ? url.href : null;
  } catch (error) {
    return null;
  }
}

function link(label, value) {
  const href = safeWebUrl(value);
  if (!href) return element("span", label + " (invalid link)", "muted");
  const anchor = element("a", label);
  anchor.href = href;
  anchor.target = "_blank";
  anchor.rel = "noopener noreferrer";
  return anchor;
}

function showMessage(text, isError) {
  message.textContent = text;
  message.className = isError ? "error" : "";
}

function formatDate(isoText) {
  const date = new Date(isoText);
  return isNaN(date) ? "" : date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

// ---------- talking to the API ----------

async function callApi(method, path, body) {
  const options = { method: method, headers: { "X-Admin-Key": adminKey } };
  if (body !== undefined) {
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  const response = await fetch("/api/v1/admin" + path, options);
  if (response.status === 401) {
    lock();
    throw new Error("Wrong admin key.");
  }
  // A 204 answer (after a delete) has no body; that simply gives {}.
  const data = await response.json().catch(function () { return {}; });
  if (!response.ok) {
    throw new Error(typeof data.detail === "string" ? data.detail : "Request failed (" + response.status + ").");
  }
  return data;
}

// The category list is public (no key needed) and never changes while the
// page is open, so it is fetched once.
async function loadCategories() {
  if (categories !== null) return;
  const response = await fetch("/api/v1/categories");
  if (!response.ok) throw new Error("Could not load the categories (" + response.status + ").");
  categories = await response.json();
}

// "12 suggestions (showing the newest 100)." for the two newest-first tabs.
function countMessage(data, word) {
  if (data.total === 0) return "No " + word + ".";
  const shown = data.items.length < data.total ? " (showing the newest " + data.items.length + ")" : "";
  return data.total + " " + word + shown + ".";
}

async function loadList() {
  showMessage("Loading…", false);
  try {
    let data;
    let renderItem;
    let doneText;
    if (currentStatus === "suggestions") {
      data = await callApi("GET", "/suggestions?limit=100");
      await loadCategories();
      renderItem = renderSuggestion;
      doneText = countMessage(data, "suggestions");
    } else if (currentStatus === "reports") {
      data = await callApi("GET", "/reports?limit=100");
      renderItem = renderReport;
      doneText = countMessage(data, "reports");
    } else {
      data = await callApi("GET", "/providers?status=" + encodeURIComponent(currentStatus));
      renderItem = renderProvider;
      doneText = data.total === 0 ? "No " + currentStatus + " profiles." : data.total + " " + currentStatus + ".";
    }
    keyPanel.hidden = true;
    listPanel.hidden = false;
    lockButton.hidden = false;
    renderList(data.items, renderItem);
    showMessage(doneText, false);
  } catch (error) {
    showMessage(error.message, true);
  }
}

async function updateProvider(provider, changes, doneText) {
  try {
    await callApi("PATCH", "/providers/" + encodeURIComponent(provider.id), changes);
    await loadList();
    showMessage(doneText, false);
  } catch (error) {
    showMessage(error.message, true);
  }
}

async function deleteSuggestion(suggestion) {
  try {
    await callApi("DELETE", "/suggestions/" + encodeURIComponent(suggestion.id));
    await loadList();
    showMessage("Deleted the suggestion for " + suggestion.name + ".", false);
  } catch (error) {
    showMessage(error.message, true);
  }
}

// `fields` holds only what the admin filled in; the server takes the rest
// from the suggestion and answers 422 naming anything still missing.
async function publishSuggestion(suggestion, fields) {
  try {
    await callApi("POST", "/suggestions/" + encodeURIComponent(suggestion.id) + "/publish", fields);
    await loadList();
    showMessage("Published " + (fields.name || suggestion.name) + " as an unverified listing.", false);
  } catch (error) {
    showMessage(error.message, true);
  }
}

async function dismissReport(report) {
  try {
    await callApi("DELETE", "/reports/" + encodeURIComponent(report.id));
    await loadList();
    showMessage("Dismissed the report about " + report.provider.name + ".", false);
  } catch (error) {
    showMessage(error.message, true);
  }
}

// ---------- drawing ----------

function addRow(table, label, valueNode) {
  table.appendChild(element("dt", label));
  const cell = element("dd");
  cell.appendChild(valueNode);
  table.appendChild(cell);
}

function renderProvider(provider) {
  const card = element("article", null, "card");

  const head = element("div", null, "card-head");
  head.appendChild(element("h2", provider.name));
  if (provider.founding_member) head.appendChild(element("span", "Founding member", "badge"));
  if (provider.featured) head.appendChild(element("span", "Featured", "badge"));
  if (provider.claimed === false) head.appendChild(element("span", "No owner (from a suggestion)", "badge"));
  card.appendChild(head);

  const table = element("dl");
  addRow(table, "Category", element("span", provider.category ? provider.category.name_en : ""));
  addRow(table, "Area", element("span", provider.area_name));
  addRow(table, "Phone", element("span", provider.phone));
  if (provider.whatsapp && provider.whatsapp !== provider.phone) {
    addRow(table, "WhatsApp", element("span", provider.whatsapp));
  }
  if (provider.price_text) addRow(table, "Price", element("span", provider.price_text));
  addRow(table, "Created", element("span", formatDate(provider.created_at)));
  card.appendChild(table);

  if (provider.description) card.appendChild(element("p", provider.description, "description"));

  const links = element("div", null, "links");
  if (provider.verification_doc_url) {
    links.appendChild(link("Verification document", provider.verification_doc_url));
  } else {
    links.appendChild(element("span", "No verification document", "muted"));
  }
  (provider.photos || []).forEach(function (photoUrl, index) {
    links.appendChild(link("Photo " + (index + 1), photoUrl));
  });
  const lat = Number(provider.lat);
  const lng = Number(provider.lng);
  if (isFinite(lat) && isFinite(lng)) {
    links.appendChild(link("Map", "https://www.google.com/maps?q=" + lat + "," + lng));
  }
  card.appendChild(links);

  // Approve / Decline proof / Restore / Reject. Each one sets the status.
  const actions = element("div", null, "actions");
  if (provider.status !== "verified") {
    const approve = element("button", "Approve", "primary");
    approve.type = "button";
    approve.addEventListener("click", function () {
      updateProvider(provider, { status: "verified" }, "Approved " + provider.name + ".");
    });
    actions.appendChild(approve);
  }
  if (provider.status === "pending") {
    // The proof was not good enough, but the listing itself is fine: it
    // stays visible, without the badge.
    const decline = element("button", "Decline proof");
    decline.type = "button";
    decline.addEventListener("click", function () {
      updateProvider(provider, { status: "unverified" }, "Declined the proof of " + provider.name + ". It stays listed as unverified.");
    });
    actions.appendChild(decline);
  }
  if (provider.status === "rejected") {
    const restore = element("button", "Restore");
    restore.type = "button";
    restore.addEventListener("click", function () {
      updateProvider(provider, { status: "unverified" }, "Restored " + provider.name + " as an unverified listing.");
    });
    actions.appendChild(restore);
  }
  if (provider.status !== "rejected") {
    const reject = element("button", "Reject", "danger");
    reject.type = "button";
    reject.addEventListener("click", function () {
      if (window.confirm("Reject " + provider.name + "? It will be hidden from the public.")) {
        updateProvider(provider, { status: "rejected" }, "Rejected " + provider.name + ".");
      }
    });
    actions.appendChild(reject);
  }
  card.appendChild(actions);

  // Founding member and featured-until
  const settings = element("div", null, "settings");

  const foundingLabel = element("label");
  const founding = element("input");
  founding.type = "checkbox";
  founding.checked = provider.founding_member === true;
  founding.addEventListener("change", function () {
    updateProvider(provider, { founding_member: founding.checked }, "Saved founding member for " + provider.name + ".");
  });
  foundingLabel.appendChild(founding);
  foundingLabel.appendChild(element("span", "Founding member"));
  settings.appendChild(foundingLabel);
  settings.appendChild(element("div", null, "spacer"));

  const featuredLabel = element("label");
  featuredLabel.appendChild(element("span", "Featured until"));
  const featured = element("input");
  featured.type = "date";
  featured.value = provider.featured_until || "";
  featuredLabel.appendChild(featured);
  settings.appendChild(featuredLabel);

  const saveFeatured = element("button", "Save date");
  saveFeatured.type = "button";
  saveFeatured.addEventListener("click", function () {
    if (!featured.value) {
      showMessage("Pick a date first, or use Clear.", true);
      return;
    }
    updateProvider(provider, { featured_until: featured.value }, "Saved featured date for " + provider.name + ".");
  });
  settings.appendChild(saveFeatured);

  const clearFeatured = element("button", "Clear");
  clearFeatured.type = "button";
  clearFeatured.disabled = !provider.featured_until;
  clearFeatured.addEventListener("click", function () {
    updateProvider(provider, { featured_until: null }, "Removed featured date for " + provider.name + ".");
  });
  settings.appendChild(clearFeatured);

  card.appendChild(settings);
  return card;
}

// A suggestion is typed by an anonymous visitor: as untrusted as it gets.
// Every value goes through element(), i.e. textContent.
function renderSuggestion(suggestion) {
  const card = element("article", null, "card");

  const head = element("div", null, "card-head");
  head.appendChild(element("h2", suggestion.name));
  card.appendChild(head);

  const table = element("dl");
  addRow(table, "Phone", element("span", suggestion.phone || "Not given"));
  addRow(table, "Category", element("span", suggestion.category ? suggestion.category.name_en : "Not given"));
  addRow(table, "Area", element("span", suggestion.area_name || "Not given"));
  const hasPosition = suggestion.lat !== null && suggestion.lng !== null;
  addRow(table, "Position", element("span", hasPosition ? suggestion.lat + ", " + suggestion.lng : "Not given"));
  addRow(table, "Date", element("span", formatDate(suggestion.created_at)));
  card.appendChild(table);

  if (suggestion.note) card.appendChild(element("p", suggestion.note, "description"));

  const publishForm = renderPublishForm(suggestion);

  const actions = element("div", null, "actions");
  const publish = element("button", "Publish", "primary");
  publish.type = "button";
  publish.addEventListener("click", function () {
    publishForm.hidden = !publishForm.hidden;
  });
  actions.appendChild(publish);
  const remove = element("button", "Delete", "danger");
  remove.type = "button";
  remove.addEventListener("click", function () {
    if (window.confirm("Delete the suggestion for " + suggestion.name + "?")) {
      deleteSuggestion(suggestion);
    }
  });
  actions.appendChild(remove);
  card.appendChild(actions);
  card.appendChild(publishForm);
  return card;
}

// One labelled input for the Publish form.
function formField(form, labelText, input) {
  const label = element("label");
  label.appendChild(element("span", labelText));
  label.appendChild(input);
  form.appendChild(label);
  return input;
}

function textInput(type, value) {
  const input = element("input");
  input.type = type;
  input.value = value === null || value === undefined ? "" : String(value);
  input.required = true;
  return input;
}

// The form behind "Publish": everything a listing needs, filled in with what
// the suggestion already has. The admin completes the empty fields (the
// browser refuses to send while one is empty) and may correct the others.
function renderPublishForm(suggestion) {
  const form = element("form", null, "publish-form");
  form.hidden = true;

  const name = formField(form, "Name", textInput("text", suggestion.name));
  const phone = formField(form, "Phone (+961…)", textInput("text", suggestion.phone));

  const category = element("select");
  category.required = true;
  const choose = element("option", "Choose a category");
  choose.value = "";
  category.appendChild(choose);
  (categories || []).forEach(function (item) {
    const option = element("option", item.name_en);
    option.value = String(item.id);
    category.appendChild(option);
  });
  category.value = suggestion.category ? String(suggestion.category.id) : "";
  formField(form, "Category", category);

  const area = formField(form, "Area", textInput("text", suggestion.area_name));

  const lat = formField(form, "Latitude (e.g. 33.8547)", textInput("number", suggestion.lat));
  lat.step = "any";
  lat.min = "-90";
  lat.max = "90";
  const lng = formField(form, "Longitude (e.g. 35.5097)", textInput("number", suggestion.lng));
  lng.step = "any";
  lng.min = "-180";
  lng.max = "180";

  const description = formField(form, "Description (optional)", element("textarea"));
  description.maxLength = 2000;

  const buttons = element("div", null, "actions");
  const send = element("button", "Publish listing", "primary");
  send.type = "submit";
  buttons.appendChild(send);
  const cancel = element("button", "Cancel");
  cancel.type = "button";
  cancel.addEventListener("click", function () {
    form.hidden = true;
  });
  buttons.appendChild(cancel);
  form.appendChild(buttons);

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    const fields = {
      name: name.value.trim(),
      phone: phone.value.trim(),
      category_id: Number(category.value),
      area_name: area.value.trim(),
      lat: Number(lat.value),
      lng: Number(lng.value)
    };
    if (description.value.trim()) fields.description = description.value.trim();
    publishSuggestion(suggestion, fields);
  });
  return form;
}

// A report is typed by an anonymous visitor too: textContent only.
function renderReport(report) {
  const card = element("article", null, "card");
  const provider = report.provider;

  const head = element("div", null, "card-head");
  head.appendChild(element("h2", provider.name));
  head.appendChild(element("span", provider.status, "badge"));
  card.appendChild(head);

  const table = element("dl");
  addRow(table, "Reason", element("span", REASON_LABELS[report.reason] || report.reason));
  addRow(table, "Date", element("span", formatDate(report.created_at)));
  card.appendChild(table);

  if (report.note) card.appendChild(element("p", report.note, "description"));

  const actions = element("div", null, "actions");
  const dismiss = element("button", "Dismiss");
  dismiss.type = "button";
  dismiss.addEventListener("click", function () {
    dismissReport(report);
  });
  actions.appendChild(dismiss);

  if (provider.status !== "rejected") {
    const reject = element("button", "Reject listing", "danger");
    reject.type = "button";
    reject.addEventListener("click", function () {
      if (window.confirm("Reject " + provider.name + "? It will be hidden from the public.")) {
        updateProvider(provider, { status: "rejected" }, "Rejected " + provider.name + ". Dismiss the report when you are done with it.");
      }
    });
    actions.appendChild(reject);
  }
  card.appendChild(actions);
  return card;
}

function renderList(items, renderItem) {
  list.replaceChildren();
  items.forEach(function (item) {
    list.appendChild(renderItem(item));
  });
  tabButtons.forEach(function (button) {
    button.setAttribute("aria-pressed", String(button.dataset.status === currentStatus));
  });
}

// ---------- locking and events ----------

function lock() {
  adminKey = "";
  list.replaceChildren();
  listPanel.hidden = true;
  lockButton.hidden = true;
  keyPanel.hidden = false;
  keyInput.value = "";
}

keyForm.addEventListener("submit", function (event) {
  event.preventDefault();
  adminKey = keyInput.value.trim();
  keyInput.value = "";
  loadList();
});

lockButton.addEventListener("click", function () {
  lock();
  showMessage("Locked.", false);
});

tabButtons.forEach(function (button) {
  button.addEventListener("click", function () {
    currentStatus = button.dataset.status;
    loadList();
  });
});
</script>
</body>
</html>

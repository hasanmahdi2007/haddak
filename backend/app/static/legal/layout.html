<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index">
<title>{{TITLE}}</title>
<style>
  :root { --ink: #1c1a22; --muted: #5d5966; --line: #e6e3ea; --accent: #4b2a8c; --ground: #fcfcfd; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #ecebf0; --muted: #b3afbd; --line: #34313b; --accent: #c7b3f5; --ground: #141218; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink);
         font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  header { border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 8px; }
  .brand { font-weight: 700; color: var(--accent); letter-spacing: .02em; }
  h1 { font-size: 1.6rem; line-height: 1.3; margin: 8px 0 4px; }
  h2 { font-size: 1.15rem; margin: 28px 0 6px; }
  p, li { color: var(--ink); }
  .muted { color: var(--muted); font-size: .92rem; }
  a { color: var(--accent); }
  section + section { border-top: 1px solid var(--line); margin-top: 40px; padding-top: 8px; }
  ul { padding-inline-start: 1.2em; }
  nav { display: flex; gap: 16px; flex-wrap: wrap; font-size: .92rem; }
</style>
</head>
<body>
<main>
<header>
  <div class="brand">حدّك · Haddak</div>
  <nav><a href="/privacy">الخصوصية · Privacy</a><a href="/terms">الشروط · Terms</a><a href="/delete-account">حذف الحساب · Delete account</a></nav>
</header>
{{BODY}}
</main>
</body>
</html>

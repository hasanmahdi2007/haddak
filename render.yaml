# Render "Blueprint": the Haddak API as a Docker web service.
# Render reads this file when you choose New → Blueprint and pick this repo.
# Step-by-step: docs/DEPLOY.md.
#
# Values marked `sync: false` are secrets: Render asks for them once in its
# dashboard and they are never stored in this (public) repository.

services:
  - type: web
    name: haddak-api
    runtime: docker
    # Frankfurt: next to the Supabase database (eu-central-1) and about 60 ms
    # from Lebanon. Every request makes several database round trips, so the
    # server must sit near the database. A region cannot be changed later.
    region: frankfurt
    # Free while testing (sleeps after 15 minutes without requests; the first
    # request then takes about a minute). Switch to "starter" ($7/month) once
    # real users depend on it.
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Render calls this to decide whether the process is alive. It does NOT
    # touch the database: a database outage must not make Render restart a
    # healthy API. The deep check (/api/v1/health, with the database) is for
    # the uptime monitor (docs/DEPLOY.md, step 5).
    healthCheckPath: /api/v1/live
    # Migrations: on the free plan the container runs them when it starts
    # (RUN_MIGRATIONS, default true, see backend/Dockerfile). On a paid plan,
    # uncomment the next line and add RUN_MIGRATIONS=false below, so they run
    # once per deploy instead of at every start (docs/DEPLOY.md, "Migrations").
    # preDeployCommand: alembic upgrade head
    # Deploy every push to main, but only after the GitHub checks pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      # Render's proxy adds the real client IP as the last X-Forwarded-For
      # entry. Without this, every user shares one IP allowance.
      - key: TRUST_PROXY
        value: "true"
      - key: PROXY_HOPS
        value: "1"
      - key: SUPABASE_JWKS_URL
        value: https://wamwmhanxqvftrwqlyfh.supabase.co/auth/v1/.well-known/jwks.json
      # Photo, story and proof links must point into this project's Storage.
      # Required in production (the API refuses to start without it).
      - key: SUPABASE_URL
        value: https://wamwmhanxqvftrwqlyfh.supabase.co
      # No browser origins: the phone app and the /admin page need no CORS.
      # Production refuses "*".
      - key: CORS_ORIGINS
        value: ""
      # Random values made by Render on the first deploy.
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ASSIST_QUOTA_SECRET
        generateValue: true
      # Secrets you paste in Render's dashboard (see docs/DEPLOY.md).
      - key: DATABASE_URL
        sync: false
      # Jarak's AI (docs/AI_ASSISTANT.md, "Provider switch"): OpenAI for most
      # sentences, Google for Arabizi. Anthropic only if ASSIST_MODEL is set
      # back to a Claude model.
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Shown on /privacy, /terms and /delete-account (Google Play needs a contact).
      - key: CONTACT_EMAIL
        sync: false
      # Sentry crash reports; leave empty to turn them off.
      - key: SENTRY_DSN
        sync: false
